<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Button Test</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #1a1915;
        background: #f3f2ed;
        font-family: "Courier New", Courier, monospace;
      }

      .telescope-button {
        position: relative;
        width: 190px;
        height: 90px;
        padding: 0;
        border: 0;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        color: #1a1915;
        background: transparent;
        cursor: pointer;
        isolation: isolate;
        -webkit-tap-highlight-color: transparent;
      }

      .telescope-button__shape {
        position: absolute;
        z-index: -1;
        inset: 0;
        width: 100%;
        height: 100%;
        overflow: visible;
        pointer-events: none;
      }

      .telescope-button__shape path {
        fill: #e3f793;
        transition: fill .4s cubic-bezier(.55, 0, .1, 1);
      }

      .telescope-button__label {
        position: relative;
        z-index: 1;
        display: flex;
        overflow: hidden;
        font-size: 17px;
        line-height: 1;
        letter-spacing: .04em;
        text-transform: uppercase;
        transition: color .4s cubic-bezier(.55, 0, .1, 1);
      }

      .telescope-button__char {
        display: block;
        white-space: pre;
        transform: translateY(0);
      }

      .telescope-button:is(:hover, :focus-visible) {
        color: #fff;
        outline: none;
      }

      .telescope-button:is(:hover, :focus-visible) .telescope-button__shape path {
        fill: #1a1915;
        animation: telescope-blob-in .52s cubic-bezier(.55, 0, .1, 1) both;
      }

      .telescope-button:is(:hover, :focus-visible) .telescope-button__char {
        animation: telescope-letter-wave .28s cubic-bezier(.55, 0, .1, 1) both;
        animation-delay: calc(var(--index) * 16ms);
      }

      .telescope-button:not(:hover):not(:focus-visible) .telescope-button__shape path {
        animation: telescope-blob-out .52s cubic-bezier(.55, 0, .1, 1) both;
      }

      @keyframes telescope-letter-wave {
        0%, 100% { transform: translateY(0); }
        46% { transform: translateY(-7px); }
      }

      @keyframes telescope-blob-in {

          d: path("M69,-0.001 C69,9.465 66.646,18.71 62.255,26.497 C62.255,26.497 32,27 -1.5,27 C-35,27 -62.255,26.497 -62.255,26.497 C-66.648,18.71 -69,9.467 -69,-0.001 C-69,-9.47 -66.648,-18.713 -62.255,-26.5 C-62.255,-26.5 -35,-26.5 -0.125,-26.5 C34.75,-26.5 62.255,-26.5 62.255,-26.5 C66.648,-18.713 69,-9.47 69,-0.001 Z");
        }
        22% {
          d: path("M69,-0.001 C69,9.465 66.646,18.71 62.255,26.497 C62.255,26.497 32,38.038 -1.5,38.038 C-35,38.038 -62.255,26.497 -62.255,26.497 C-66.648,18.71 -69,9.467 -69,-0.001 C-69,-9.47 -66.648,-18.713 -62.255,-26.5 C-62.255,-26.5 -35,-37.539 -0.125,-37.539 C34.75,-37.539 62.255,-26.5 62.255,-26.5 C66.648,-18.713 69,-9.47 69,-0.001 Z");
        }
        42% {
          d: path("M69,-0.001 C69,9.465 66.646,18.71 62.255,26.497 C62.255,26.497 32,32.705 -1.5,32.705 C-35,32.705 -62.255,26.497 -62.255,26.497 C-66.648,18.71 -69,9.467 -69,-0.001 C-69,-9.47 -66.648,-18.713 -62.255,-26.5 C-62.255,-26.5 -35,-32.206 -0.125,-32.206 C34.75,-32.206 62.255,-26.5 62.255,-26.5 C66.648,-18.713 69,-9.47 69,-0.001 Z");
        }
        64% {
          d: path("M69,-0.001 C69,9.465 66.646,18.71 62.255,26.497 C62.255,26.497 32,22.011 -1.5,22.011 C-35,22.011 -62.255,26.497 -62.255,26.497 C-66.648,18.71 -69,9.467 -69,-0.001 C-69,-9.47 -66.648,-18.713 -62.255,-26.5 C-62.255,-26.5 -35,-21.512 -0.125,-21.512 C34.75,-21.512 62.255,-26.5 62.255,-26.5 C66.648,-18.713 69,-9.47 69,-0.001 Z");
        }
        82% {
          d: path("M69,-0.001 C69,9.465 66.646,18.71 62.255,26.497 C62.255,26.497 32,28.998 -1.5,28.998 C-35,28.998 -62.255,26.497 -62.255,26.497 C-66.648,18.71 -69,9.467 -69,-0.001 C-69,-9.47 -66.648,-18.713 -62.255,-26.5 C-62.255,-26.5 -35,-28.499 -0.125,-28.499 C34.75,-28.499 62.255,-26.5 62.255,-26.5 C66.648,-18.713 69,-9.47 69,-0.001 Z");
        }
        100% {
          d: path("M69,-0.001 C69,9.465 66.646,18.71 62.255,26.497 C62.255,26.497 32,27 -1.5,27 C-35,27 -62.255,26.497 -62.255,26.497 C-66.648,18.71 -69,9.467 -69,-0.001 C-69,-9.47 -66.648,-18.713 -62.255,-26.5 C-62.255,-26.5 -35,-26.5 -0.125,-26.5 C34.75,-26.5 62.255,-26.5 62.255,-26.5 C66.648,-18.713 69,-9.47 69,-0.001 Z");
        }
      }

      @keyframes telescope-blob-out {
        0%, 100% {
          d: path("M69,-0.001 C69,9.465 66.646,18.71 62.255,26.497 C62.255,26.497 32,27 -1.5,27 C-35,27 -62.255,26.497 -62.255,26.497 C-66.648,18.71 -69,9.467 -69,-0.001 C-69,-9.47 -66.648,-18.713 -62.255,-26.5 C-62.255,-26.5 -35,-26.5 -0.125,-26.5 C34.75,-26.5 62.255,-26.5 62.255,-26.5 C66.648,-18.713 69,-9.47 69,-0.001 Z");
        }
        34% {
          d: path("M69,-0.001 C69,9.465 66.646,18.71 62.255,26.497 C62.255,26.497 32,21.5 -1.5,21.5 C-35,21.5 -62.255,26.497 -62.255,26.497 C-66.648,18.71 -69,9.467 -69,-0.001 C-69,-9.47 -66.648,-18.713 -62.255,-26.5 C-62.255,-26.5 -35,-21 -0.125,-21 C34.75,-21 62.255,-26.5 62.255,-26.5 C66.648,-18.713 69,-9.47 69,-0.001 Z");
        }
        70% {
          d: path("M69,-0.001 C69,9.465 66.646,18.71 62.255,26.497 C62.255,26.497 32,30 -1.5,30 C-35,30 -62.255,26.497 -62.255,26.497 C-66.648,18.71 -69,9.467 -69,-0.001 C-69,-9.47 -66.648,-18.713 -62.255,-26.5 C-62.255,-26.5 -35,-29.5 -0.125,-29.5 C34.75,-29.5 62.255,-26.5 62.255,-26.5 C66.648,-18.713 69,-9.47 69,-0.001 Z");
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .telescope-button__shape path,
        .telescope-button__char {
          animation: none !important;
        }
      }
    </style>
  </head>
  <body>
    <main id="button-test">
      <button class="telescope-button" type="button" aria-label="Let's talk">
        <span class="telescope-button__label" data-button-label>Let's talk</span>
        <svg class="telescope-button__shape" viewBox="0 0 285 165" preserveAspectRatio="none" aria-hidden="true">
          <g transform="matrix(2 0 0 2 142.5 82.5)">
            <path d="M69,-0.001 C69,9.465 66.646,18.71 62.255,26.497 C62.255,26.497 32,27 -1.5,27 C-35,27 -62.255,26.497 -62.255,26.497 C-66.648,18.71 -69,9.467 -69,-0.001 C-69,-9.47 -66.648,-18.713 -62.255,-26.5 C-62.255,-26.5 -35,-26.5 -0.125,-26.5 C34.75,-26.5 62.255,-26.5 62.255,-26.5 C66.648,-18.713 69,-9.47 69,-0.001 Z"></path>
          </g>
        </svg>
      </button>
    </main>

    <script>
      'use strict';

      document.querySelectorAll('[data-button-label]').forEach((label) => {
        const text = label.textContent;
        label.textContent = '';

        [...text].forEach((character, index) => {
          const span = document.createElement('span');
          span.className = 'telescope-button__char';
          span.style.setProperty('--index', index);
          span.textContent = character === ' ' ? '\u00a0' : character;
          span.setAttribute('aria-hidden', 'true');
          label.appendChild(span);
        });
      });
    </script>
  </body>
</html>
